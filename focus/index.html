<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Matrix — Ambient Pomodoro & Deep Work Space | VN Labs</title>
    <meta name="description" content="Minimalist, ambient Pomodoro timer with procedural rain and alpha binaural beats. 100% offline, zero ads, zero distraction.">
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00E5FF">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glow-orb cyan"></div>
    <div class="glow-orb purple"></div>

    <nav class="standard-nav">
        <a href="../index.html" class="logo">vn<span>labs</span></a>
        <div class="nav-actions">
            <button class="zen-btn" id="btn-zen-mode" title="Toggle Fullscreen Zen Mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                <span>Zen Mode</span>
            </button>
        </div>
    </nav>

    <main class="focus-container">
        
        <!-- Center Timer Area -->
        <section class="timer-section">
            <div class="mode-chips">
                <button class="chip active" data-time="1500" data-mode="focus">Deep Focus (25m)</button>
                <button class="chip" data-time="300" data-mode="short">Short Break (5m)</button>
                <button class="chip" data-time="900" data-mode="long">Long Rest (15m)</button>
                <button class="chip" data-time="3000" data-mode="flow">Flow (50m)</button>
            </div>

            <div class="timer-display-wrap">
                <!-- SVG Progress Ring -->
                <svg class="progress-ring" viewBox="0 0 320 320">
                    <circle class="ring-bg" cx="160" cy="160" r="140"></circle>
                    <circle class="ring-progress" id="timer-progress-ring" cx="160" cy="160" r="140"></circle>
                </svg>

                <div class="timer-inner">
                    <div class="time-readout" id="timer-display">25:00</div>
                    <div class="timer-mode-label" id="timer-label">STAY IN THE ZONE</div>
                </div>
            </div>

            <div class="timer-controls">
                <button class="btn btn-primary btn-large" id="btn-start-pause">
                    <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span id="start-btn-label">Start Focus</span>
                </button>
                <button class="btn btn-secondary icon-only" id="btn-reset-timer" title="Reset Timer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                </button>
            </div>
        </section>

        <!-- Bottom Grid: Ambient Sound Mixer + Session Task List -->
        <div class="focus-grid">
            
            <!-- Ambient Sounds Mixer -->
            <section class="card ambient-card">
                <div class="card-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    <h3>Procedural Ambient Sounds</h3>
                </div>
                <p class="card-desc">Synthesized in real-time. Works 100% offline, zero buffering.</p>

                <div class="sound-tracks">
                    <!-- Rain -->
                    <div class="track-item">
                        <button class="track-toggle" data-sound="rain">
                            <span class="sound-icon">🌧️</span>
                            <span class="sound-name">Gentle Rain</span>
                        </button>
                        <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.5" data-sound="rain">
                    </div>

                    <!-- Binaural Alpha Beats -->
                    <div class="track-item">
                        <button class="track-toggle" data-sound="binaural">
                            <span class="sound-icon">🧠</span>
                            <span class="sound-name">Alpha Waves (10Hz)</span>
                        </button>
                        <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.4" data-sound="binaural">
                    </div>

                    <!-- Deep Drone / White Noise -->
                    <div class="track-item">
                        <button class="track-toggle" data-sound="drone">
                            <span class="sound-icon">🌌</span>
                            <span class="sound-name">Cosmic Drone</span>
                        </button>
                        <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.3" data-sound="drone">
                    </div>

                    <!-- Campfire Crackle -->
                    <div class="track-item">
                        <button class="track-toggle" data-sound="fire">
                            <span class="sound-icon">🔥</span>
                            <span class="sound-name">Campfire</span>
                        </button>
                        <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.4" data-sound="fire">
                    </div>
                </div>
            </section>

            <!-- Focus Goals -->
            <section class="card tasks-card">
                <div class="card-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    <h3>Session Goals</h3>
                </div>

                <div class="task-input-wrap">
                    <input type="text" id="new-task-input" placeholder="What are you focusing on?" class="task-input">
                    <button id="btn-add-task" class="btn btn-secondary">Add</button>
                </div>

                <div class="tasks-list" id="tasks-list">
                    <div class="empty-tasks">No tasks added yet. Add 1-2 key priorities for this session.</div>
                </div>
            </section>

        </div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
