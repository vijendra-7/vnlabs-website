<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gate Calculator — Official Exam Replica | VN Labs</title>
    <meta name="description" content="Exact 1:1 replica of the official GATE Virtual Scientific Calculator. Practice calculation speed, layout, and exam functions.">
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3876ea">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-tcs">

    <!-- Floating Theme Toggle (Zero vertical footprint) -->
    <button class="floating-theme-btn" id="btn-theme-toggle" title="Toggle Theme">
        <span id="theme-icon">🌓</span>
    </button>

    <main class="calc-page-container">
        
        <!-- The Authentic GATE Calculator Unit -->
        <div class="gate-calc-window" id="calc-window">
            
            <!-- Window Title Bar -->
            <div class="calc-titlebar">
                <span class="calc-title-text">Gate Calculator</span>
            </div>

            <!-- Main Body -->
            <div class="calc-body">
                
                <!-- Display Boxes -->
                <div class="display-container">
                    <input type="text" id="calc-expr" class="calc-box-top" readonly placeholder="">
                    <input type="text" id="calc-display" class="calc-box-bottom" readonly value="0">
                </div>

                <!-- Row 1: Mod, Deg/Rad, Memory -->
                <div class="calc-row-top">
                    <button class="btn-calc btn-normal btn-mod" data-action="mod">mod</button>
                    
                    <div class="angle-group">
                        <label class="radio-label">
                            <input type="radio" name="angle-mode" value="deg" checked id="mode-deg">
                            <span>Deg</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="angle-mode" value="rad" id="mode-rad">
                            <span>Rad</span>
                        </label>
                    </div>

                    <div class="mem-group">
                        <button class="btn-calc btn-normal" data-action="mc">MC</button>
                        <button class="btn-calc btn-normal" data-action="mr">MR</button>
                        <button class="btn-calc btn-normal" data-action="ms">MS</button>
                        <button class="btn-calc btn-normal" data-action="mplus">M+</button>
                        <button class="btn-calc btn-normal" data-action="mminus">M-</button>
                    </div>
                </div>

                <!-- 11-Column Keypad Grid -->
                <div class="calc-grid">
                    
                    <!-- Row 2 -->
                    <button class="btn-calc btn-normal" data-action="sinh">sinh</button>
                    <button class="btn-calc btn-normal" data-action="cosh">cosh</button>
                    <button class="btn-calc btn-normal" data-action="tanh">tanh</button>
                    <button class="btn-calc btn-normal" data-action="exp">Exp</button>
                    <button class="btn-calc btn-normal" data-action="open-paren">(</button>
                    <button class="btn-calc btn-normal" data-action="close-paren">)</button>
                    <button class="btn-calc btn-red col-span-2" data-action="backspace">←</button>
                    <button class="btn-calc btn-red" data-action="c">C</button>
                    <button class="btn-calc btn-red" data-action="sign">+/-</button>
                    <button class="btn-calc btn-normal" data-action="sqrt">√</button>

                    <!-- Row 3 -->
                    <button class="btn-calc btn-normal" data-action="asinh">sinh⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="acosh">cosh⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="atanh">tanh⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="log2">log₂x</button>
                    <button class="btn-calc btn-normal" data-action="ln">ln</button>
                    <button class="btn-calc btn-normal" data-action="log">log</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="7">7</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="8">8</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="9">9</button>
                    <button class="btn-calc btn-normal" data-op="/">/</button>
                    <button class="btn-calc btn-normal" data-action="percent">%</button>

                    <!-- Row 4 -->
                    <button class="btn-calc btn-normal" data-action="pi">π</button>
                    <button class="btn-calc btn-normal" data-action="e">e</button>
                    <button class="btn-calc btn-normal" data-action="fact">n!</button>
                    <button class="btn-calc btn-normal" data-action="logyx">log<sub>y</sub>x</button>
                    <button class="btn-calc btn-normal" data-action="ex">eˣ</button>
                    <button class="btn-calc btn-normal" data-action="exp10">10ˣ</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="4">4</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="5">5</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="6">6</button>
                    <button class="btn-calc btn-normal" data-op="*">*</button>
                    <button class="btn-calc btn-normal" data-action="inv">1/x</button>

                    <!-- Row 5 -->
                    <button class="btn-calc btn-normal" data-action="sin">sin</button>
                    <button class="btn-calc btn-normal" data-action="cos">cos</button>
                    <button class="btn-calc btn-normal" data-action="tan">tan</button>
                    <button class="btn-calc btn-normal" data-action="xy">xʸ</button>
                    <button class="btn-calc btn-normal" data-action="cube">x³</button>
                    <button class="btn-calc btn-normal" data-action="sqr">x²</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="1">1</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="2">2</button>
                    <button class="btn-calc btn-normal btn-digit" data-num="3">3</button>
                    <button class="btn-calc btn-normal" data-op="-">-</button>
                    <button class="btn-calc btn-green row-span-2" data-action="equals" id="btn-equals">=</button>

                    <!-- Row 6 -->
                    <button class="btn-calc btn-normal" data-action="asin">sin⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="acos">cos⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="atan">tan⁻¹</button>
                    <button class="btn-calc btn-normal" data-action="yroot">ʸ√x</button>
                    <button class="btn-calc btn-normal" data-action="cbrt">∛</button>
                    <button class="btn-calc btn-normal" data-action="abs">|x|</button>
                    <button class="btn-calc btn-normal btn-digit col-span-2" data-num="0">0</button>
                    <button class="btn-calc btn-normal btn-digit" data-num=".">.</button>
                    <button class="btn-calc btn-normal" data-op="+">+</button>

                </div>
            </div>

        </div>

        <!-- Subtle Bottom Branding -->
        <footer class="calc-footer-brand">
            <a href="../index.html" class="logo">vn<span>labs</span></a>
        </footer>

    </main>

    <script src="app.js" defer></script>
</body>
</html>
