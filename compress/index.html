<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VN Compress | Smart Image Optimization</title>
    <meta name="description" content="Client-side, privacy-first image compression. Resize and optimize photos to exact file sizes instantly in your browser.">
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <div class="glow-orb purple"></div>
    <div class="glow-orb cyan" style="top: 60%; right: -10%;"></div>
    
    <nav class="standard-nav fade-in visible desktop-nav">
        <a href="../index.html" class="logo">vn<span>labs</span></a>
    </nav>

    <main class="compress-container fade-in visible">
        <!-- ISOLATION TEST: Barebones File Input -->
        <div style="background: rgba(255,0,0,0.2); border: 2px solid red; padding: 20px; margin-bottom: 20px; border-radius: 12px;">
            <h3 style="color: white; margin-bottom: 10px;">DEBUG TEST: Raw File Input</h3>
            <p style="font-size: 14px; margin-bottom: 10px;">Please try selecting an image here. This bypasses all complex app logic.</p>
            <input type="file" id="debug-file-input" style="display: block; margin-bottom: 10px; background: white; color: black; padding: 5px;">
            <img id="debug-img-preview" style="max-width: 200px; display: block; border: 1px solid white; min-height: 50px;">
        </div>
        <script>
            document.getElementById('debug-file-input').addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        document.getElementById('debug-img-preview').src = ev.target.result;
                        alert("INLINE DEBUG SUCCESS: Image rendered!");
                    };
                    reader.readAsDataURL(file);
                }
            });
        </script>

        <div class="compress-header">
            <h1>VN Compress</h1>
            <p>Smart, 100% private, client-side image optimization.</p>
        </div>

        <div class="glass-panel main-panel">
            <div class="split-layout">
                <!-- Left: Dropzone & Preview -->
                <div class="left-panel">
                    <label id="dropzone" class="dropzone">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <h3>Drop Image Here</h3>
                        <p>or click to browse</p>
                        <input type="file" id="file-input" accept="image/*" style="opacity: 0; position: absolute; width: 0; height: 0; z-index: -1;">
                    </label>
                    
                    <div id="preview-container" class="preview-container" style="display: none;">
                        <img id="image-preview" src="" alt="Preview">
                        <div class="image-meta" id="original-meta">Original: --</div>
                        <button id="btn-remove" class="btn btn-secondary small-btn" style="margin-top: 12px; width: 100%;">Remove Image</button>
                    </div>
                </div>

                <div class="divider">
                    <span class="divider-text">⚙️</span>
                </div>

                <!-- Right: Controls -->
                <div class="right-panel controls-panel">
                    <div class="control-group">
                        <label>Target File Size (Optional)</label>
                        <div class="input-with-suffix">
                            <input type="number" id="target-size" placeholder="e.g. 50">
                            <span class="suffix">KB</span>
                        </div>
                        <p class="helper-text">App will auto-compress to stay just under this size.</p>
                    </div>

                    <div class="control-group row-group">
                        <div style="flex:1">
                            <label>Max Width</label>
                            <input type="number" id="max-width" placeholder="e.g. 1920">
                        </div>
                        <div style="flex:1">
                            <label>Max Height</label>
                            <input type="number" id="max-height" placeholder="e.g. 1080">
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Resize Mode</label>
                        <select id="resize-mode">
                            <option value="fit">Fit (Preserve Aspect Ratio)</option>
                            <option value="crop">Crop (Fill exact dimensions)</option>
                            <option value="pad">Pad (Fill space with color)</option>
                        </select>
                    </div>

                    <div class="control-group" id="pad-color-container" style="display: none; padding-top: 4px;">
                        <label>Padding Background Color</label>
                        <div style="display: flex; gap: 12px; align-items: center; margin-top: 4px;">
                            <input type="color" id="pad-color-picker" value="#ffffff" style="width: 40px; height: 40px; padding: 0; border: none; border-radius: 8px; cursor: pointer; background: transparent;">
                            <div class="quick-colors">
                                <div class="quick-color" data-color="#ffffff" style="background: #ffffff;" title="White"></div>
                                <div class="quick-color" data-color="#000000" style="background: #000000; border: 1px solid rgba(255,255,255,0.3);" title="Black"></div>
                                <div class="quick-color" data-color="#00E5FF" style="background: #00E5FF;" title="VN Cyan"></div>
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Output Format</label>
                        <select id="output-format">
                            <option value="image/jpeg">JPEG (Best for photos)</option>
                            <option value="image/webp">WebP (Smallest size)</option>
                            <option value="image/png">PNG (Preserves transparency)</option>
                        </select>
                    </div>

                    <div class="control-group checkbox-group">
                        <input type="checkbox" id="strip-metadata" checked>
                        <label for="strip-metadata">Strip EXIF/Location Data (Privacy)</label>
                    </div>

                    <button id="btn-compress" class="btn btn-primary compress-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                        Compress Image
                    </button>
                    
                    <!-- Result Area -->
                    <div id="result-area" class="result-area" style="display: none;">
                        <div class="result-stats">
                            <div class="stat-box">
                                <span class="stat-label">New Size</span>
                                <span class="stat-value highlight" id="new-size-val">--</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">Saved</span>
                                <span class="stat-value" id="saved-val" style="color: var(--emerald);">--</span>
                            </div>
                        </div>
                        <button id="btn-download" class="btn btn-primary" style="width: 100%; margin-top: 12px; background: rgba(0, 229, 255, 0.1); border-color: rgba(0, 229, 255, 0.3);">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download Result
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mobile-footer">
        <a href="../index.html" class="logo">vn<span>labs</span></a>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
