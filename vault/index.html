<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickVault — Phone ↔ PC Instant Bridge | VN Labs</title>
    <meta name="description" content="Instant, secure clipboard and scratchpad bridge between your phone and PC. Zero login, 4-digit PIN pairing, completely encrypted.">
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glow-orb cyan"></div>
    <div class="glow-orb purple"></div>

    <nav class="standard-nav">
        <a href="../index.html" class="logo">vn<span>labs</span></a>
        <div class="nav-badge">
            <span class="status-dot" id="sync-status-dot"></span>
            <span id="sync-status-text">Standby</span>
        </div>
    </nav>

    <main class="vault-container">
        <!-- Room Bar -->
        <header class="vault-header">
            <div class="room-pill">
                <span class="label">VAULT ROOM PIN:</span>
                <input type="text" id="room-pin-input" maxlength="6" placeholder="1234" autocomplete="off" spellcheck="false">
                <button id="btn-join-room" class="btn-pill">Join</button>
                <button id="btn-random-room" class="btn-pill secondary" title="Random PIN">🎲</button>
                <button id="btn-show-qr" class="btn-pill secondary" title="Show QR Code">📱 QR</button>
            </div>
            <p class="room-hint">Open this page on your phone with the same PIN to sync text instantly.</p>
        </header>

        <!-- QR Modal -->
        <div id="qr-modal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Scan to Open on Phone</h3>
                <p>Instant phone-to-PC connection with this room PIN.</p>
                <div id="room-qrcode" class="qr-box"></div>
                <button id="btn-close-qr" class="btn btn-secondary">Close</button>
            </div>
        </div>

        <div class="vault-grid">
            <!-- Active Live Scratchpad -->
            <section class="vault-card active-clip-card">
                <div class="card-header">
                    <div class="title-wrap">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                        <h2>Live Clipboard</h2>
                    </div>
                    <div class="badge" id="peer-count-badge">Devices linked: 0</div>
                </div>

                <div class="editor-wrap">
                    <textarea id="live-text" placeholder="Type, paste links, OTPs, or text here... It syncs to your connected devices in real-time." spellcheck="false"></textarea>
                </div>

                <div class="action-bar">
                    <div class="btn-group">
                        <button id="btn-copy-live" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                        <button id="btn-open-link" class="btn btn-secondary" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            Open Link
                        </button>
                        <button id="btn-save-clip" class="btn btn-secondary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            Save Note
                        </button>
                    </div>
                    <button id="btn-clear-live" class="btn-danger-ghost">Clear</button>
                </div>
            </section>

            <!-- Saved Clips / Pinned Notes -->
            <section class="vault-card pinned-card">
                <div class="card-header">
                    <div class="title-wrap">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                        <h2>Saved Snippets</h2>
                    </div>
                    <button id="btn-clear-history" class="btn-ghost-small">Clear All</button>
                </div>

                <div id="clips-list" class="clips-list">
                    <div class="empty-state">No saved notes yet. Click "Save Note" to pin useful text.</div>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
